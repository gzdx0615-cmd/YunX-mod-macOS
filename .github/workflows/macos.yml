name: macOS build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Compile, test, and package
        run: gradle :desktop:test :desktop:packageDmg :desktop:packagePkg --stacktrace
      - name: Smoke launch packaged app
        env:
          YUNX_DESKTOP_DATA_DIR: ${{ runner.temp }}/yunx-smoke-data
        run: |
          app=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p desktop/build/smoke
          "$app/Contents/MacOS/YunX-OS" > desktop/build/smoke/console.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat desktop/build/smoke/console.log
              find "$YUNX_DESKTOP_DATA_DIR" -name '*.log' -exec tail -80 {} \; || true
              exit 1
            fi
            sleep 1
          done
          screencapture -x desktop/build/smoke/desktop.png
          find "$YUNX_DESKTOP_DATA_DIR" -name '*.log' -exec cp {} desktop/build/smoke/ \; || true
      - name: Upload app, installers, and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YunX-OS-${{ matrix.arch }}
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/pkg/*.pkg
            desktop/build/reports/tests/test/
            desktop/build/test-results/test/
            desktop/build/smoke/
          if-no-files-found: warn
