name: macOS build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Compile, test, and package
        run: gradle :desktop:test :desktop:packageDmg :desktop:packagePkg --stacktrace
      - name: Upload app, installers, and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YunX-OS-${{ matrix.arch }}
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/pkg/*.pkg
            desktop/build/reports/tests/test/
          if-no-files-found: warn
